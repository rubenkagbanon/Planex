<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&display=swap" rel="stylesheet">
  <style>
    @keyframes planexFill {
      0%, 100% { opacity: 0.3; transform: scale(0.82); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes planexLetterIn {
      from { opacity: 0; transform: scale(0.82); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</helmet>
<div style="display:flex; align-items:center; gap:{{ gap }}px;">
  <svg width="{{ size }}" height="{{ size }}" viewBox="0 0 28 28" style="flex-shrink:0;">
    <rect x="1" y="1" width="8" height="8" rx="2" fill="{{ colorA }}" style="transform-origin:5px 5px; animation:planexFill 2.6s ease-in-out infinite; animation-delay:0s;"/>
    <rect x="10" y="1" width="8" height="8" rx="2" fill="{{ colorB }}" style="transform-origin:14px 5px; animation:planexFill 2.6s ease-in-out infinite; animation-delay:0.2s;"/>
    <rect x="19" y="1" width="8" height="8" rx="2" fill="{{ colorA }}" style="transform-origin:23px 5px; animation:planexFill 2.6s ease-in-out infinite; animation-delay:0.4s;"/>
    <rect x="1" y="10" width="8" height="8" rx="2" fill="{{ colorA }}" style="transform-origin:5px 14px; animation:planexFill 2.6s ease-in-out infinite; animation-delay:0.6s;"/>
    <rect x="10" y="10" width="8" height="8" rx="2" fill="{{ colorA }}" style="transform-origin:14px 14px; animation:planexFill 2.6s ease-in-out infinite; animation-delay:0.8s;"/>
    <rect x="19" y="10" width="8" height="8" rx="2" fill="{{ colorB }}" style="transform-origin:23px 14px; animation:planexFill 2.6s ease-in-out infinite; animation-delay:1s;"/>
    <rect x="1" y="19" width="8" height="8" rx="2" fill="{{ colorB }}" style="transform-origin:5px 23px; animation:planexFill 2.6s ease-in-out infinite; animation-delay:1.2s;"/>
    <rect x="10" y="19" width="8" height="8" rx="2" fill="{{ colorA }}" style="transform-origin:14px 23px; animation:planexFill 2.6s ease-in-out infinite; animation-delay:1.4s;"/>
    <rect x="19" y="19" width="8" height="8" rx="2" fill="{{ colorA }}" style="transform-origin:23px 23px; animation:planexFill 2.6s ease-in-out infinite; animation-delay:1.6s;"/>
  </svg>
  <sc-if value="{{ showText }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex; font-family:'Newsreader', serif; font-size:{{ textSize }}px; font-weight:600; color:{{ textColor }};">
      <span style="display:inline-block; opacity:0; animation:planexLetterIn 0.5s ease-out forwards; animation-delay:0s;">P</span>
      <span style="display:inline-block; opacity:0; animation:planexLetterIn 0.5s ease-out forwards; animation-delay:0.08s;">l</span>
      <span style="display:inline-block; opacity:0; animation:planexLetterIn 0.5s ease-out forwards; animation-delay:0.16s;">a</span>
      <span style="display:inline-block; opacity:0; animation:planexLetterIn 0.5s ease-out forwards; animation-delay:0.24s;">n</span>
      <span style="display:inline-block; opacity:0; animation:planexLetterIn 0.5s ease-out forwards; animation-delay:0.32s;">e</span>
      <span style="display:inline-block; opacity:0; animation:planexLetterIn 0.5s ease-out forwards; animation-delay:0.4s;">x</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:80},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:34,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:16,&quot;max&quot;:120,&quot;step&quot;:2},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;]},&quot;showText&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;textSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:26,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:12,&quot;max&quot;:80,&quot;step&quot;:1},&quot;gap&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:2,&quot;max&quot;:40,&quot;step&quot;:1}}">
class Component extends DCLogic {
  renderVals() {
    const size = this.props.size ?? 34;
    const dark = this.props.variant === 'light';
    const showText = this.props.showText ?? true;
    return {
      size,
      gap: this.props.gap ?? Math.round(size * 0.35),
      colorA: dark ? '#F3EFE3' : '#1F3A2E',
      colorB: dark ? '#C08F3E' : '#A9762C',
      textColor: dark ? '#F3EFE3' : '#1F3A2E',
      textSize: this.props.textSize ?? Math.round(size * 0.76),
      showText,
    };
  }
}
</script>
</body>
</html>
